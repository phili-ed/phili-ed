{% extends 'base.html' %}

{% block title %} Home {% endblock %}

    {% block content %}
    <div class="container">
    <form action="/result" method="GET">
        <div class="row">
        <div class="card col-12 p-3">
        <h4 class="card-title">Select topics :</h4>
        <div class="row">
        {% for topic in all_topics %}
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card p-2 m-2">
                    <label>
                        <input type="checkbox" name="topic" value="{{ topic.id }}">{{topic.id}} {{ topic.name }}
                    </label>
                </div>
            </div>      
        {%  endfor  %}
        </div>
        </div>
        </div>
        <div class="row">
        <div class="col-12 col-md-6">
            <div class="card m-2 p-3">
            <h4 class="card-title form-label d-block">Practice types:</h4>
            <label>
                <input type="checkbox" name="level" value="3">Level 3
            </label>
            <label>
                <input type="checkbox" name="level" value="4">Level 4
            </label>
            <label>
                <input type="checkbox" name="level" value="5">Level 5
            </label>
            <label>
                <input type="checkbox" name="level" value="0">Multiple Choices
            </label>
            </div>
        </div>
        <div class="col-12 col-md-6">
            <div class="card m-2 p-3">
            <h4 class="card-title form-label d-block">Language / 語言:</h4>
    
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="language" id="langEng" value="Eng" checked>
                <label class="form-check-label" for="langEn">English</label>
            </div>
    
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="language" id="langChi" value="Chi">
                <label class="form-check-label" for="langZh">中文 (Chinese)</label>
            </div>
            </div>
        </div>
        </div>
        <div class="row">
        <div class="col-12">
            <button class="btn btn-primary m-3 p-1 w-100" type="submit">Search</button>
        </div>
        </div>
    </form>
    </div>
    </div>
    </div>
    {% endblock %}
