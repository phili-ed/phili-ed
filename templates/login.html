{% extends 'base.html' %}
{% block title %} Login {% endblock %}

{% block content %}
<!-- Use vh-100 and d-flex to center vertically and horizontally -->
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <!-- Limit width so centering is visible (col-md-6) -->
    <div class="card shadow-sm p-4 col-12 col-md-6 col-lg-4">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0">LOG IN 登入</h4>
            <!-- Button stays on the right within this flex row -->
            <a class="btn btn-sm btn-outline-info" href="/contact">Sign Up</a>
        </div>

        <form action="{{ request.full_path }}" method="POST">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Username" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>        
            
            <div class="d-grid mt-4">
                <button class="btn btn-primary" type="submit">Login</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
