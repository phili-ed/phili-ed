{% extends 'base.html' %}

{% block title %} Manage {% endblock %}

    {% block content %}

    <div class="card mb-4">
    <div class="card-body">
        <form method="POST">
            <label>Enter Practice ID to Manage:</label>
            <div class="input-group">
                <input type="text" name="search_id" class="form-control" placeholder="Paste ID here...">
                <button class="btn btn-primary">Find Practice</button>
            </div>
        </form>
    </div>
</div>

{% if practice %}
<div class="alert alert-warning">
    <h4>Confirm Deletion</h4>
    <p><strong>Topic:</strong> {{ practice.topic }} | <strong>Level:</strong> {{ practice.level }}</p>
    
    <iframe src="{{ practice.questionLink }}" width="100%" height="200px"></iframe>

    <form action="{{ url_for('delete_practice', id=practice.id) }}" method="POST" class="mt-3">
        <button type="submit" class="btn btn-danger" onclick="return confirm('Are you absolutely sure?')">
            Permanently Delete ID: {{ practice.id }}
        </button>
    </form>
</div>
{% endif %}

    {% endblock %}
