{% extends 'base.html' %}

{% block title %} Results {% endblock %}

    {% block content %}

  <div class="accordion" id="mainAccordion">
  {% for p in practices %}
  <div class="accordion-item">
    <h2 class="accordion-header">
      <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#practice-{{p.id}}">
        <p> Practice#  {{p.id}} 
        {% if p.topics %}
            {{ p.topics|map(attribute='name')|join(', ') }}
        {% else %}
            No Topic Assigned
        {% endif %}
      </button>
    </h2>
    <div id="practice-{{p.id}}" class="accordion-collapse collapse" data-bs-parent="#mainAccordion">
      <div class="accordion-body">        
        <h6 class="text-primary">📝 Question</h6>
        <div class="row">
          <div class="col-md-8">
        {% if lang=='Chi' %}
        <iframe src="https://docs.google.com/gview?url={{ p.questionLink_C|urlencode }}&embedded=true" 
        class="w-100 rounded mb-3" 
        style="height: 400px; border: 1px solid #ddd;"
        loading="lazy">
        </iframe>
        {% else %}
        <iframe src="https://docs.google.com/gview?url={{ p.questionLink|urlencode }}&embedded=true" 
        class="w-100 rounded mb-3" 
        style="height: 400px; border: 1px solid #ddd;"
        loading="lazy">
        </iframe>
        {% endif %}
          </div>
          <div class="col-md-4">
            <div class="mt-3">
              <label class="form-label text-muted small">Local Workspace (Auto-saves to this browser)</label>
              <textarea 
                id="notes-{{ p.id }}" 
                class="form-control" 
                rows="10" 
                placeholder="Write on the Left or Type here."
                oninput="saveLocally('{{ p.id }}', this.value)"></textarea>
            </div>
            <div class="mt-2">
              <button class="btn btn-sm btn-outline-secondary" onclick="downloadNote('{{ p.id }}')">
                📥 Download as .txt
              </button>
            </div>
          </div>
        </div>

        <div class="border-top pt-3">
            <button class="btn btn-sm btn-outline-success mb-2" type="button" data-bs-toggle="collapse" data-bs-target="#ans-content-{{p.id}}">
                 Answer: Practice # {{ p.id }}
            </button>
            <div class="collapse" id="ans-content-{{p.id}}">
              {% if lang=='Chi' %}
                <iframe src="https://docs.google.com/gview?url={{ p.answerLink_C|urlencode }}&embedded=true" 
                        class="w-100 rounded mb-3" 
                        style="height: 400px; border: 1px solid #ddd;"
                        loading="lazy">
                </iframe>
              {% else %}
                <iframe src="https://docs.google.com/gview?url={{ p.answerLink|urlencode }}&embedded=true" 
                        class="w-100 rounded mb-3" 
                        style="height: 400px; border: 1px solid #ddd;"
                        loading="lazy">
                </iframe>
              {% endif %}
              </div>
        </div>
      </div>
    </div>
  </div>
  {% endfor %}
  </div>    
  <script src="{{ url_for('static',filename='js/result.js')}}"></script>

    {% endblock %}
